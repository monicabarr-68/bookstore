services:
  mysql:
    image: mysql:8.0
    container_name: curso-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mysql123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pmysql123"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: